plugins { id 'com.android.application' }
android {
    namespace 'vn.lit.eyemodule'
    compileSdk 35
    packaging { jniLibs { useLegacyPackaging = false } }
    ndkVersion '27.1.12297006'
    defaultConfig {
        applicationId 'vn.lit.eyemodule'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3'
        testInstrumentationRunner 'vn.lit.eyemodule.ExportInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly project(':stub') }
